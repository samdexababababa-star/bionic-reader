[project]
name = "bionic-reader-backend"
version = "0.1.0"
description = "Backend API for Bionic Reader Pro - converts files to ADHD-friendly bionic reading format"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "markdown-it-py>=3.0.0",
    "striprtf>=0.0.28",
    "chardet>=5.2.0",
    "pydantic>=2.9.0",
    # OCR for scanned PDFs and image uploads.
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    # HTTP client for the wave/intention quantum-randomness fetcher (ANU QRNG)
    # and the optional Mistral creative layer.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
